version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: bunker
      POSTGRES_PASSWORD: bunker
      POSTGRES_DB: bunkercolab_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunker -d bunkercolab_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://bunker:bunker@db:5432/bunkercolab_dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/app:/app/app
      - ./server/alembic:/app/alembic
      - ./server/tests:/app/tests
      - ./server/alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    command: >
      bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
