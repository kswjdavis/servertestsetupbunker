server {
    listen 80;
    listen [::]:80;
    server_name bunkercolab.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bunkercolab.example.com;

    # SSL certificates installed by certbot
    ssl_certificate /etc/letsencrypt/live/bunkercolab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bunkercolab.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bunkercolab.access.log;
    error_log /var/log/nginx/bunkercolab.error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Serve React single-page application
    root /var/www/bunkercolab;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Allow ACME challenge during certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
