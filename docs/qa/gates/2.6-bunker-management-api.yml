requirements_trace:
  AC1_create_bunker:
    test: "test_create_bunker_applies_global_defaults"
    given: "Valid bunker payload with admin authentication"
    when: "POST to /api/v1/bunkers"
    then: "Bunker created with GlobalConfig defaults applied, returns 201 with bunker details"

  AC2_list_bunkers:
    test: "test_list_and_get_bunker_include_device_count"
    given: "One or more bunkers exist in database"
    when: "GET to /api/v1/bunkers"
    then: "Returns list of all bunkers with device counts"

  AC3_get_bunker_details:
    test: "test_list_and_get_bunker_include_device_count"
    given: "Bunker exists with associated devices"
    when: "GET to /api/v1/bunkers/{id}"
    then: "Returns bunker details with accurate device_count"

  AC4_update_bunker:
    test: "test_update_bunker_resets_optional_fields_with_null"
    given: "Bunker exists with custom values"
    when: "PUT to /api/v1/bunkers/{id} with null values for optional fields"
    then: "Bunker updated with GlobalConfig defaults reapplied for null fields"

  AC5_delete_bunker_cascade:
    test: "test_delete_bunker_cascades_devices"
    given: "Bunker exists with associated devices"
    when: "DELETE to /api/v1/bunkers/{id}"
    then: "Bunker and all associated devices deleted, returns 204"

