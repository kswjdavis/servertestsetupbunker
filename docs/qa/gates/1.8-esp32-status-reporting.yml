nfr_validation:
  security:
    status: PASS
    notes: |
      Authentication: EXCELLENT
      - Device bearer tokens validated against database (UUID format enforced)
      - Invalid/missing/malformed tokens properly rejected with 401
      - Token comparison case-insensitive for scheme
      - Auth token stored securely in NVS on firmware side
      - Fail-safe mode triggers on authentication failure

      Transport Security: PASS
      - HTTPS enforced with TLS certificate validation
      - SNTP time synchronization for certificate expiry checks
      - Retry logic with exponential backoff

      Data Validation: PASS
      - Pydantic schemas enforce field constraints
      - Input validation on both firmware and backend
      - SQL injection prevented by SQLAlchemy ORM

      Sensitive Data Handling: PASS
      - Auth tokens cleared from memory on deinit
      - Tokens logged with truncation (first 8 chars only)
      - No plaintext credentials in code

  performance:
    status: PASS
    notes: |
      Backend: GOOD
      - Upsert uses PostgreSQL native INSERT...ON CONFLICT
      - Single database round-trip per status report
      - No N+1 query issues
      - Async I/O throughout prevents blocking

      Firmware: GOOD
      - 60-second reporting interval prevents server overload
      - vTaskDelayUntil ensures precise timing without drift
      - JSON serialization uses compact representation
      - HTTP client uses reasonable timeout (10s)
      - Stack size (4KB) appropriate for task complexity

      Load Characteristics:
      - Each device: 1 req/min
      - 1000 devices: ~16.7 req/sec (well within FastAPI capacity)
      - Database writes: ~33.4 writes/sec at 1000 devices

  reliability:
    status: PASS
    notes: |
      Firmware Resilience: EXCELLENT
      - WiFi disconnection handled gracefully
      - HTTP failures logged but don't crash task
      - Authentication failure triggers fail-safe mode
      - Memory management: JSON strings freed, response bodies cleaned
      - Initial authentication check separated from periodic loop

      Backend Resilience: GOOD
      - Database transaction properly committed (after fix)
      - Repository upsert handles both insert and update atomically
      - HTTP exceptions properly raised with appropriate status codes
      - Dependency injection ensures proper session lifecycle

      Observability: EXCELLENT
      - Comprehensive ESP_LOG statements (INFO, WARN, ERROR levels)
      - Clear logging of authentication state transitions
      - Server decision logged with all fields for debugging
      - Free heap monitoring included in firmware
      - Device state tracking ("booting", "authenticated", "auth_failed")

  maintainability:
    status: PASS
    notes: |
      Code Clarity: EXCELLENT
      - Functions have clear single responsibilities
      - Variable names descriptive and consistent
      - Comments explain "why" not just "what"
      - Magic numbers extracted to named constants

      Documentation: EXCELLENT
      - Comprehensive inline documentation with Doxygen-style headers
      - Story file includes example code and JSON payloads
      - API contracts clearly defined in schemas
      - FR (Functional Requirement) references in comments

      Testability: GOOD
      - Backend highly testable via dependency injection
      - Firmware harder to test due to ESP-IDF dependencies
      - Clear interfaces between components enable future mocking
      - Stub pattern used for deadman_timer (Story 2.1 dependency)

      Technical Debt:
      - Stub Component: deadman_timer placeholder (intentional, documented)
      - Test Coverage: Firmware lacks automated tests for status reporting task
      - Control Logic: Placeholder shutdown logic (intentional, Story 2.5)

